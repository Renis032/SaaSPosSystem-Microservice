spring.application.name=billing-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:5005}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/pos_billing
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://127.0.0.1:5173}

services.auth.url=${AUTH_SERVICE_URL:http://localhost:5001}
services.store.url=${STORE_SERVICE_URL:http://localhost:5002}
services.catalog.url=${CATALOG_SERVICE_URL:http://localhost:5003}
services.sales.url=${SALES_SERVICE_URL:http://localhost:5004}
services.billing.url=${BILLING_SERVICE_URL:http://localhost:5005}
services.report.url=${REPORT_SERVICE_URL:http://localhost:5006}

stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price.starter=${STRIPE_PRICE_STARTER:}
stripe.price.pro=${STRIPE_PRICE_PRO:}
stripe.currency=${STRIPE_CURRENCY:usd}

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
