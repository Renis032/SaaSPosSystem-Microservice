x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: ${MYSQL_USER:-root}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-a-very-long-random-secret-key-that-is-at-least-32-bytes-long}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-update}
  FLYWAY_ENABLED: "false"
  SHOW_SQL: ${SHOW_SQL:-false}
  STRIPE_API_KEY: ${STRIPE_API_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
  STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
  STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
  AUTH_SERVICE_URL: http://auth-service:5001
  STORE_SERVICE_URL: http://store-service:5002
  CATALOG_SERVICE_URL: http://catalog-service:5003
  SALES_SERVICE_URL: http://sales-service:5004
  BILLING_SERVICE_URL: http://billing-service:5005
  REPORT_SERVICE_URL: http://report-service:5006

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_DATABASE: pos_auth
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

  auth-service:
    build:
      context: ./services/auth-service
    restart: unless-stopped
    environment:
      <<: *java-env
      SERVER_PORT: 5001
      MYSQL_DATABASE: pos_auth
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy

  store-service:
    build:
      context: ./services/store-service
    restart: unless-stopped
    environment:
      <<: *java-env
      SERVER_PORT: 5002
      MYSQL_DATABASE: pos_store
    ports:
      - "5002:5002"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started

  catalog-service:
    build:
      context: ./services/catalog-service
    restart: unless-stopped
    environment:
      <<: *java-env
      SERVER_PORT: 5003
      MYSQL_DATABASE: pos_catalog
    ports:
      - "5003:5003"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started

  sales-service:
    build:
      context: ./services/sales-service
    restart: unless-stopped
    environment:
      <<: *java-env
      SERVER_PORT: 5004
      MYSQL_DATABASE: pos_sales
    ports:
      - "5004:5004"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      billing-service:
        condition: service_started

  billing-service:
    build:
      context: ./services/billing-service
    restart: unless-stopped
    environment:
      <<: *java-env
      SERVER_PORT: 5005
      MYSQL_DATABASE: pos_billing
    ports:
      - "5005:5005"
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started

  report-service:
    build:
      context: ./services/report-service
    restart: unless-stopped
    environment:
      <<: *java-env
      SERVER_PORT: 5006
      MYSQL_DATABASE: pos_report
    ports:
      - "5006:5006"
    depends_on:
      mysql:
        condition: service_healthy
      sales-service:
        condition: service_started
      catalog-service:
        condition: service_started

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    depends_on:
      - auth-service
      - store-service
      - catalog-service
      - sales-service
      - billing-service
      - report-service

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - gateway

volumes:
  mysql_data:
