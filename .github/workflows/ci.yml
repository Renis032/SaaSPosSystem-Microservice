name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/auth-service/pom.xml
      - name: Unit tests
        run: ./mvnw -B test -Dtest=StoreAccessServiceImplTest

  sales-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sales-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/sales-service/pom.xml
      - name: Unit / integration tests
        run: ./mvnw -B test -Dtest=OrderServiceInventoryLockTest,OrderStockRefundIntegrationTest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
