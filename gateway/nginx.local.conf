worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx-gateway.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    client_max_body_size 20m;

    upstream auth_service { server 127.0.0.1:5001; }
    upstream store_service { server 127.0.0.1:5002; }
    upstream catalog_service { server 127.0.0.1:5003; }
    upstream sales_service { server 127.0.0.1:5004; }
    upstream billing_service { server 127.0.0.1:5005; }
    upstream report_service { server 127.0.0.1:5006; }

    server {
        listen 5000;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        location = /actuator/health {
            default_type application/json;
            return 200 '{"status":"UP","service":"api-gateway"}';
        }

        location /auth/ { proxy_pass http://auth_service; }
        location /api/users { proxy_pass http://auth_service; }
        location /api/dev { proxy_pass http://auth_service; }

        location /api/stores { proxy_pass http://store_service; }
        location /api/branches { proxy_pass http://store_service; }
        location /api/employees { proxy_pass http://store_service; }

        location /api/products { proxy_pass http://catalog_service; }
        location /api/categories { proxy_pass http://catalog_service; }
        location /api/inventories { proxy_pass http://catalog_service; }

        location /api/orders { proxy_pass http://sales_service; }
        location /api/refunds { proxy_pass http://sales_service; }
        location /api/customers { proxy_pass http://sales_service; }
        location /api/shift-report { proxy_pass http://sales_service; }

        location /api/billing { proxy_pass http://billing_service; }
        location /api/reports { proxy_pass http://report_service; }
        location /api/audit-logs { proxy_pass http://report_service; }

        location / {
            default_type application/json;
            return 404 '{"error":"Unknown route"}';
        }
    }
}
