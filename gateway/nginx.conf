worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Upstream microservice targets (Docker Compose DNS names)
    upstream auth_service { server auth-service:5001; }
    upstream store_service { server store-service:5002; }
    upstream catalog_service { server catalog-service:5003; }
    upstream sales_service { server sales-service:5004; }
    upstream billing_service { server billing-service:5005; }
    upstream report_service { server report-service:5006; }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr"';

    access_log /var/log/nginx/access.log main;

    server {
        listen 5000;
        server_name _;

        # Forward Authorization and common proxy headers to every service
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        location = /actuator/health {
            default_type application/json;
            return 200 '{"status":"UP","service":"api-gateway"}';
        }

        # --- auth-service ---
        location /auth/ {
            proxy_pass http://auth_service;
        }
        location /api/users {
            proxy_pass http://auth_service;
        }
        location /api/dev {
            proxy_pass http://auth_service;
        }

        # --- store-service ---
        location /api/stores {
            proxy_pass http://store_service;
        }
        location /api/branches {
            proxy_pass http://store_service;
        }
        location /api/employees {
            proxy_pass http://store_service;
        }

        # --- catalog-service ---
        location /api/products {
            proxy_pass http://catalog_service;
        }
        location /api/categories {
            proxy_pass http://catalog_service;
        }
        location /api/inventories {
            proxy_pass http://catalog_service;
        }

        # --- sales-service ---
        location /api/orders {
            proxy_pass http://sales_service;
        }
        location /api/refunds {
            proxy_pass http://sales_service;
        }
        location /api/customers {
            proxy_pass http://sales_service;
        }
        location /api/shift-report {
            proxy_pass http://sales_service;
        }

        # --- billing-service ---
        location /api/billing {
            proxy_pass http://billing_service;
        }

        # --- report-service ---
        location /api/reports {
            proxy_pass http://report_service;
        }
        location /api/audit-logs {
            proxy_pass http://report_service;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"Unknown route. Use /auth or /api/* via the API gateway."}';
        }
    }
}
